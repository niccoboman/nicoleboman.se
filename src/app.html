<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0d0d0d" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />

		<!-- Scroll-animationer bara när JavaScript körs; annars syns allt direkt -->
		<script>
			document.documentElement.classList.add('js');
			// Mörkt läge är standard. Sätts före första renderingen så att sidan inte blinkar vitt.
			// Bara den som själv valt ljust läge (sparat i localStorage) får ljust.
			var tema = 'mork';
			try {
				if (localStorage.getItem('tema') === 'ljus') tema = 'ljus';
			} catch (e) {}
			if (tema === 'mork') document.documentElement.dataset.tema = 'mork';
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Archivo: brödtext. Anton: rubriker. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Anton&family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
